name: Deploy web app

# Publishes MeshEditor Online (MeshEditor.Web) to Azure Static Web Apps.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_0F2FE9203: the deployment token of the Static Web App
# (Azure portal: the Static Web App > Overview > Manage deployment token). See MeshEditor.Web/README.md.

on:
  push:
    branches: [master]
  # any branch can be deployed from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deployment token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_0F2FE9203 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_0F2FE9203 is not set. See MeshEditor.Web/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish MeshEditor.Web -c Release -o publish

      # the app is built above: the action only uploads publish/wwwroot
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_0F2FE9203 }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
          skip_api_build: true
