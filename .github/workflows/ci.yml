name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  avalonia-tests:
    # The test project builds the app and everything it depends on.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The viewport renders through a hidden GLFW window with a legacy OpenGL compatibility
      # context: Mesa's software renderer provides it on a virtual X display.
      - name: Install Mesa and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Build
        # Debug, so Debug.Assert failures in the app fail the tests
        run: dotnet build MeshEditor.Avalonia.Tests

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s "-screen 0 1280x1024x24" dotnet test MeshEditor.Avalonia.Tests --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            MeshEditor.Avalonia.Tests/bin/Debug/net10.0/*.png

  avalonia-tests-windows:
    # The runners have no GPU: Mesa's software OpenGL (llvmpipe, from mesa-dist-win) is put next to the test host,
    # which loads it instead of the system opengl32.dll.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MESA_VERSION: 26.2.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        # Debug, so Debug.Assert failures in the app fail the tests
        run: dotnet build MeshEditor.Avalonia.Tests

      - name: Install Mesa next to the test host
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP mesa.7z
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          # with paths and without recursion: the archive has the same files for x86 and arm64 too
          $mesa = Join-Path $env:RUNNER_TEMP mesa
          7z x $archive "-o$mesa" x64/opengl32.dll x64/libgallium_wgl.dll -r- -y
          Copy-Item "$mesa/x64/opengl32.dll", "$mesa/x64/libgallium_wgl.dll" MeshEditor.Avalonia.Tests/bin/Debug/net10.0
          Get-ChildItem MeshEditor.Avalonia.Tests/bin/Debug/net10.0/opengl32.dll, MeshEditor.Avalonia.Tests/bin/Debug/net10.0/libgallium_wgl.dll

      - name: Test
        env:
          GALLIUM_DRIVER: llvmpipe
        run: dotnet test MeshEditor.Avalonia.Tests --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            TestResults
            MeshEditor.Avalonia.Tests/bin/Debug/net10.0/*.png

  web-build:
    # The web app and its worker (WebAssembly); no workload is needed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish MeshEditor.Web -c Release -o publish

  linux-package:
    # The Debian package (linux-deployment/mesheditor/build), downloadable from the run's artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the package
        run: linux-deployment/mesheditor/build

      - name: Check that apt can install it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-deployment/mesheditor/out/mesheditor_*_amd64.deb
          # the version command prints to stderr and exits with 1 (as help does): check its output
          output=$(fem-format-converter version 2>&1 || true)
          grep 'FEM format converter' <<< "$output"
          test -x /usr/lib/mesheditor/MeshEditor

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: linux-deployment/mesheditor/out/*.deb

  linux-package-install:
    # Installs the Debian package on other distributions than the runner's, so that a dependency missing there (as the ICU
    # package of the newer releases, issue #46) fails here. The converter also checks that the runtime finds ICU.
    needs: linux-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:rolling', 'debian:stable', 'debian:testing']
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-package

      - name: Install the package
        run: |
          apt-get update
          apt-get install -y ./mesheditor_*_amd64.deb
          output=$(fem-format-converter version 2>&1 || true)
          echo "$output"
          grep 'FEM format converter' <<< "$output"

  windows-package:
    # The self-contained Windows zip (windows-deployment/build.ps1), downloadable from the run's artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the package
        run: windows-deployment/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows-deployment/out/*.zip
